<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>操作知识库 - 完美图文打印版</title>
    <style>
        @media print {
            @page { size: A4; margin: 15mm; }
            
            /* ==========================================
               核心 1：强制浏览器打印所有背景色和卡片样式（保住颜值）
               ========================================== */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* 隐藏无关的UI按键，但不破坏整体排版 */
            button, .toggle-icon, .video-banner, 
            input[type="radio"], input[type="checkbox"] { 
                display: none !important; 
            }

            /* ==========================================
               核心 2：精准释放空间，阻止叠罗汉，保留原有框架
               ========================================== */
            /* 释放所有容器的高度限制，允许内容向下延伸 */
            html, body, div, section, article, main, .card, [class*="content"] {
                height: auto !important;
                max-height: none !important;
                overflow: visible !important;
            }

            /* 专门针对选项卡和折叠面板进行静态平铺（取消绝对定位） */
            .tab-pane, .collapse, [class*="step-"], [hidden], .d-none {
                display: block !important;
                position: static !important; /* 彻底解决你截图里重叠/叠罗汉的问题 */
                visibility: visible !important;
                opacity: 1 !important;
                margin-bottom: 20px !important;
                page-break-inside: avoid; /* 尽量不让一个卡片被切到两页 */
            }

            /* 强制 Flex 布局允许换行，防止右侧被切掉 */
            .row, [class*="d-flex"], [style*="display: flex"], [style*="display:flex"] {
                flex-wrap: wrap !important;
            }

            /* ==========================================
               核心 3：保护表格和图片的原本排版
               ========================================== */
            table { width: 100% !important; border-collapse: collapse !important; word-wrap: break-word !important; }
            img { max-width: 100% !important; height: auto !important; page-break-inside: avoid; }
            
            body { background-color: #fff; color: #333; font-family: "Quicksand", sans-serif; }
            .page-break { page-break-after: always; }
        }
        
        #loading { color: #0f9d58; font-size: 18px; font-weight: bold; margin-bottom: 20px; padding: 20px; border: 2px dashed #0f9d58; background: #e6f4ea; }
    </style>
</head>
<body>
    <div id="loading">正在抓取原汁原味的图文排版，并智能展开选项卡...</div>
    <div id="print-container"></div>

    <script>
        async function mergePages() {
            const pages = ['index.html'];
            for (let i = 1; i <= 10; i++) pages.push(`tab${i}.html`);

            let container = document.getElementById('print-container');
            let parser = new DOMParser();

            for (let page of pages) {
                try {
                    let response = await fetch(page);
                    if (!response.ok) continue;
                    let text = await response.text();
                    let doc = parser.parseFromString(text, 'text/html');

                    // 保留原网页所有的 CSS
                    let styles = doc.querySelectorAll('style');
                    styles.forEach(s => document.head.appendChild(s.cloneNode(true)));

                    let bodyContent = doc.body;

                    // 破解防印开关
                    bodyContent.querySelectorAll('input').forEach(input => {
                        input.removeAttribute('name');
                        input.setAttribute('checked', 'checked');
                        input.checked = true;
                    });
                    bodyContent.querySelectorAll('details').forEach(d => d.setAttribute('open', 'true'));

                    // JS 层面精准剥离隐藏类名，但不破坏原本的 class 结构
                    bodyContent.querySelectorAll('.collapse, .fade, .d-none, [hidden]').forEach(el => {
                        el.classList.remove('collapse', 'fade', 'd-none');
                        el.removeAttribute('hidden');
                        el.style.display = 'block';
                        el.style.visibility = 'visible';
                        el.style.height = 'auto';
                        el.style.opacity = '1';
                        el.style.position = 'static'; // 阻止定位重叠
                    });

                    let div = document.createElement('div');
                    div.className = 'page-break';
                    while (bodyContent.firstChild) {
                        div.appendChild(bodyContent.firstChild);
                    }
                    container.appendChild(div);
                } catch (e) {
                    console.error('加载错误: ' + page, e);
                }
            }

            document.getElementById('loading').innerHTML = '✅ 网页加载完毕！背景色、表格已保留，所有隐藏的选项卡均已平铺。<br><br>👉 请按 Ctrl + P，务必在打印设置中勾选【背景图形 (Background graphics)】，然后另存为 PDF。';
        }

        mergePages();
    </script>
</body>
</html>
