<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>操作知识库 - 完整排版缝合版</title>
    <style>
        @media print {
            @page { size: A4; margin: 15mm; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; box-sizing: border-box !important; overflow-x: visible !important; }
            
            button, .toggle-icon, .nav-tabs, .video-banner, input[type="radio"], input[type="checkbox"], #globalSearchModal { display: none !important; }
            
            /* ==========================================
               🚨 核心修复：表格防挤压 & 防跨页撕裂
               ========================================== */
            .table-wrap, .sop-table-wrap, .matrix-table-wrap {
                display: block !important; width: 100% !important; overflow: visible !important; margin-bottom: 20px !important;
            }
            
            table { 
                width: 100% !important; 
                table-layout: fixed !important; 
                border-collapse: collapse !important; 
            }
            
            th, td { 
                /* 破除源码手机端 100% 宽度的垄断，让第四列重见天日 */
                width: auto !important; 
                word-wrap: break-word !important; 
                word-break: normal !important; /* 严禁把中文字符挤成竖排 */
                white-space: normal !important; 
                padding: 10px !important;
            }
            
            /* 严禁表格行被切成两半，解决截图里被拉长的恐怖排版 */
            tr { page-break-inside: avoid !important; }

            img { max-width: 100% !important; height: auto !important; object-fit: contain !important; page-break-inside: avoid; }
            .page-break { page-break-after: always; }
            
            /* ==========================================
               所有隐藏类名强制展现
               ========================================== */
            .tab-content > *, .tab-pane, [class*="tab-pane"],
            .pseo-tab-pane, .pseo-pane-inner, .cluster-detail, .pseo-card-body, 
            [id^="pseo-inner-"], [id^="clusterDetail"],
            .accordion-collapse, .accordion-body, .panel-collapse, [class*="accordion"], [id*="collapse"], .card-body, .expand-content {
                display: block !important; position: static !important; opacity: 1 !important; visibility: visible !important; height: auto !important; max-height: none !important; overflow: visible !important; margin-bottom: 20px !important;
            }
            
            details, details > * { display: block !important; height: auto !important; }
            .pseo-adaptive-wrapper { flex-direction: column !important; }
            .pseo-tabs-nav { display: none !important; }
            body { background-color: #fff !important; color: #000 !important; }
        }
        body { font-family: "Quicksand", "Segoe UI", sans-serif; padding: 20px; }
        #loading { color: #d93025; font-size: 18px; font-weight: bold; margin-bottom: 20px; padding: 20px; border: 2px dashed #d93025; background: #fff3f3; }
    </style>
</head>
<body>
    <div id="loading">正在执行【全量展开 + 终极排版修复】，请稍候...</div>
    <div id="print-container"></div>

    <script>
        async function mergePages() {
            const pages = ['index.html'];
            for (let i = 1; i <= 10; i++) pages.push(`tab${i}.html`);

            let container = document.getElementById('print-container');
            let parser = new DOMParser();

            for (let page of pages) {
                try {
                    let response = await fetch(page);
                    if (!response.ok) continue;
                    let text = await response.text();
                    let doc = parser.parseFromString(text, 'text/html');

                    let styles = doc.querySelectorAll('style');
                    styles.forEach(s => document.head.appendChild(s.cloneNode(true)));

                    let bodyContent = doc.body;

                    bodyContent.querySelectorAll('input').forEach(input => {
                        input.removeAttribute('name');
                        input.setAttribute('checked', 'checked');
                        input.checked = true;
                    });

                    bodyContent.querySelectorAll('details').forEach(d => {
                        d.setAttribute('open', 'true');
                        d.open = true;
                    });

                    bodyContent.querySelectorAll('[class*="collapse"], [class*="d-none"], [hidden], [style*="display: none"], [style*="display:none"]').forEach(el => {
                        el.classList.remove('collapse', 'fade', 'd-none', 'hidden');
                        el.removeAttribute('hidden');
                        el.style.display = 'block';
                        el.style.visibility = 'visible';
                        el.style.height = 'auto';
                        el.style.opacity = '1';
                    });

                    bodyContent.querySelectorAll('.pseo-tab-pane, .pseo-pane-inner, .cluster-detail, .pseo-card-body, .expand-content').forEach(el => {
                        el.classList.add('active', 'open', 'show'); 
                        el.style.setProperty('display', 'block', 'important');
                        el.style.setProperty('opacity', '1', 'important');
                    });

                    let div = document.createElement('div');
                    div.className = 'page-break';
                    while (bodyContent.firstChild) {
                        div.appendChild(bodyContent.firstChild);
                    }
                    container.appendChild(div);
                } catch (e) {
                    console.error('加载错误: ' + page, e);
                }
            }

            setTimeout(() => {
                const allElements = document.querySelectorAll('#print-container *');
                const bodyWidth = document.body.clientWidth;

                allElements.forEach(el => {
                    const tagName = el.tagName.toUpperCase();
                    // 表格组件全量豁免，保护它们不被砸碎
                    if (['TABLE', 'TBODY', 'THEAD', 'TR', 'TD', 'TH', 'COLGROUP', 'COL'].includes(tagName)) {
                        return;
                    }

                    if (window.getComputedStyle(el).overflowX === 'auto' || window.getComputedStyle(el).overflowX === 'scroll') {
                        el.style.setProperty('overflow-x', 'visible', 'important');
                        el.style.setProperty('flex-wrap', 'wrap', 'important');
                        el.style.setProperty('white-space', 'normal', 'important');
                    }

                    if (el.scrollWidth > bodyWidth + 10) { 
                        el.style.setProperty('display', 'block', 'important');
                        el.style.setProperty('width', '100%', 'important');
                        el.style.setProperty('max-width', '100%', 'important');
                        el.style.setProperty('white-space', 'normal', 'important');

                        Array.from(el.children).forEach(child => {
                            const childTag = child.tagName.toUpperCase();
                            if (!['TABLE', 'TBODY', 'THEAD', 'TR', 'TD', 'TH'].includes(childTag)) {
                                child.style.setProperty('display', 'block', 'important');
                                child.style.setProperty('width', '100%', 'important');
                                child.style.setProperty('max-width', '100%', 'important');
                            }
                        });
                    }
                });

                document.getElementById('loading').innerHTML = '✅ 致命排版 Bug 已修复！表格跨页撕裂与竖排文字已解决。<br><br>👉 按 Ctrl + F5 强刷网页，然后按 Ctrl + P 导出 PDF（背景图形记得勾选）。';
                document.getElementById('loading').style.borderColor = '#0f9d58';
                document.getElementById('loading').style.backgroundColor = '#e6f4ea';
                document.getElementById('loading').style.color = '#0f9d58';
            }, 1500); 
        }

        mergePages();
    </script>
</body>
</html>
