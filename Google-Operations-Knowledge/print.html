<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>操作知识库 - V7增强打印版</title>
    <style>
        @media print {
            @page { size: A4; margin: 15mm; }
            
            /* 必须加上这句，确保图一里的表格底色和标签背景能打印出来 */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            
            button, .toggle-icon, .nav-tabs, .video-banner, input[type="radio"], input[type="checkbox"] { display: none !important; }
            table { width: 100% !important; table-layout: fixed !important; word-wrap: break-word !important; }
            img { max-width: 100% !important; height: auto !important; object-fit: contain !important; page-break-inside: avoid; }
            .page-break { page-break-after: always; }
            
            /* ==========================================
               新增针对图二的 CSS 补丁：所有选项卡内容强制显示并取消叠加
               ========================================== */
            .tab-content > *, .tab-pane, [class*="tab-pane"] {
                display: block !important;
                position: static !important; /* 阻止它们叠在同一个位置 */
                opacity: 1 !important;
                visibility: visible !important;
                height: auto !important;
                max-height: none !important;
                overflow: visible !important;
                margin-bottom: 20px !important;
            }

            /* V7 的无差别强制换行底层保障 */
            * {
                overflow-x: visible !important;
                white-space: normal !important; 
                box-sizing: border-box !important;
            }
            body { background-color: #fff !important; color: #000 !important; }
        }
        body { font-family: "Quicksand", "Segoe UI", sans-serif; padding: 20px; }
        #loading { color: #d93025; font-size: 18px; font-weight: bold; margin-bottom: 20px; padding: 20px; border: 2px dashed #d93025; background: #fff3f3; }
    </style>
</head>
<body>
    <div id="loading">正在执行【V7物理测量 + 强制激活全部选项卡】，请稍候...</div>
    <div id="print-container"></div>

    <script>
        async function mergePages() {
            const pages = ['index.html'];
            for (let i = 1; i <= 10; i++) pages.push(`tab${i}.html`);

            let container = document.getElementById('print-container');
            let parser = new DOMParser();

            for (let page of pages) {
                try {
                    let response = await fetch(page);
                    if (!response.ok) continue;
                    let text = await response.text();
                    let doc = parser.parseFromString(text, 'text/html');

                    let styles = doc.querySelectorAll('style');
                    styles.forEach(s => document.head.appendChild(s.cloneNode(true)));

                    let bodyContent = doc.body;

                    bodyContent.querySelectorAll('input').forEach(input => {
                        input.removeAttribute('name');
                        input.setAttribute('checked', 'checked');
                        input.checked = true;
                    });

                    bodyContent.querySelectorAll('details').forEach(d => d.setAttribute('open', 'true'));

                    bodyContent.querySelectorAll('[class*="collapse"], [class*="d-none"], [hidden], [style*="display: none"], [style*="display:none"]').forEach(el => {
                        el.classList.remove('collapse', 'fade', 'd-none', 'hidden');
                        el.removeAttribute('hidden');
                        el.style.display = 'block';
                        el.style.visibility = 'visible';
                        el.style.height = 'auto';
                        el.style.opacity = '1';
                    });

                    // ==========================================
                    // 新增针对图二的 JS 补丁：强行给未激活的 ②③④ 选项卡打鸡血
                    // ==========================================
                    bodyContent.querySelectorAll('.tab-pane, .tab-content > div, [class*="tab-pane"], [id^="pane-"]').forEach(el => {
                        el.classList.add('active', 'show'); // 骗过框架的隐藏逻辑
                        el.style.setProperty('display', 'block', 'important');
                        el.style.setProperty('opacity', '1', 'important');
                        el.style.setProperty('visibility', 'visible', 'important');
                        el.style.setProperty('position', 'static', 'important'); 
                    });

                    let div = document.createElement('div');
                    div.className = 'page-break';
                    while (bodyContent.firstChild) {
                        div.appendChild(bodyContent.firstChild);
                    }
                    container.appendChild(div);
                } catch (e) {
                    console.error('加载错误: ' + page, e);
                }
            }

            // ==========================================
            // 继承 V7 的杀手锏：物理测量并摧毁横向溢出
            // ==========================================
            setTimeout(() => {
                const allElements = document.querySelectorAll('#print-container *');
                const bodyWidth = document.body.clientWidth;

                allElements.forEach(el => {
                    if (window.getComputedStyle(el).overflowX === 'auto' || window.getComputedStyle(el).overflowX === 'scroll') {
                        el.style.setProperty('overflow-x', 'visible', 'important');
                        el.style.setProperty('flex-wrap', 'wrap', 'important');
                        el.style.setProperty('white-space', 'normal', 'important');
                    }

                    if (el.scrollWidth > bodyWidth + 10) { 
                        el.style.setProperty('display', 'block', 'important');
                        el.style.setProperty('width', '100%', 'important');
                        el.style.setProperty('max-width', '100%', 'important');
                        el.style.setProperty('white-space', 'normal', 'important');

                        Array.from(el.children).forEach(child => {
                            child.style.setProperty('display', 'block', 'important');
                            child.style.setProperty('width', '100%', 'important');
                            child.style.setProperty('max-width', '100%', 'important');
                            child.style.setProperty('margin-bottom', '20px', 'important');
                        });
                    }
                });

                document.getElementById('loading').innerHTML = '✅ V7 修复增强版执行完毕！图二缺失内容已强制激活展开。<br><br>👉 按 Ctrl + P 导出 PDF（务必在更多设置中勾选“背景图形”以保留表格颜色）。';
                document.getElementById('loading').style.borderColor = '#0f9d58';
                document.getElementById('loading').style.backgroundColor = '#e6f4ea';
                document.getElementById('loading').style.color = '#0f9d58';
            }, 1500); 
        }

        mergePages();
    </script>
</body>
</html>
