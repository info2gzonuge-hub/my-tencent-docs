name: Auto Update Algo
on:
  schedule:
    - cron: '0 2 1 */3 *'  # 👈 在这里修改你的自动抓取频率
  workflow_dispatch:     # 保留这个，允许你随时在网页上手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python build.py
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Google-Operations-Knowledge/tab1.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update algo [skip ci]" && git push)
