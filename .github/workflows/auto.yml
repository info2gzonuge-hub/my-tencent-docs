name: Auto Update
on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install beautifulsoup4 requests openai
      - run: python build.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Google-Operations-Knowledge/index.html Google-Operations-Knowledge/tab1.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update via DeepSeek [skip ci]" && git push)
